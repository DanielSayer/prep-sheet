services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: prep_sheet_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prep_sheet_test"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
