name: prep-sheet

services:
  postgres:
    image: postgres:18
    container_name: prep-sheet-postgres
    environment:
      POSTGRES_DB: prep-sheet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - prep-sheet_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  prep-sheet_postgres_data:
