/* Option 3 revision: existing Prep Sheet component styling, with the docket's layout. */
#canvas[data-variant="C"]{font-family:'Trebuchet MS',Arial,sans-serif}
.docket-page{gap:64px;padding-top:52px;align-items:center}
.docket-page>div{min-width:0}
.docket-page h1{font-family:inherit;font-size:clamp(48px,5.4cqw,66px);font-weight:700;line-height:1.07;letter-spacing:-2.6px}
.docket-page .eyebrow{font-family:inherit;font-size:13px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--green);margin-bottom:16px}
.docket-page .intro{color:#596451;font-size:17px;max-width:395px}
.docket{background:#fffef9;border:2px solid var(--ink);border-radius:18px;padding:26px;box-shadow:0 6px 0 #dfdfcc}
.docket:before{display:none}
.docket:focus-within{box-shadow:0 6px 0 #cbd8b9}
.docket-title{border:0;margin:0 0 24px;padding:0}
.docket-title h2{font-family:inherit;font-weight:700;font-size:25px;letter-spacing:-.5px}
.docket .composer label{font-family:inherit;font-size:13px;font-weight:800;letter-spacing:0;text-transform:none;margin-bottom:12px}
.docket textarea{min-height:145px;background:none;line-height:1.65;font-family:inherit}
.docket .composer-bottom{border-top:1px solid var(--line);margin-top:8px;padding-top:18px}
.docket .composer-bottom small{display:none}
.docket .primary{background:var(--green);border:2px solid #35532d;border-radius:12px;box-shadow:0 4px 0 #35532d;font-size:15px;font-weight:800;min-height:50px;padding:12px 20px;justify-content:space-between}
.docket .primary:hover{background:#466e38}
.docket .secondary{display:block;margin:15px auto 0;font-size:13px;color:#596451;text-decoration:none;padding:10px 14px;border-radius:8px}
.docket .secondary:hover{background:#f0eddf;color:var(--ink)}
.docket-page .shelf{display:block;border:0;padding:0;margin-top:25px}
.docket-page .shelf p{font-size:13px;color:#596451;max-width:345px;line-height:1.7}
@container(max-width:650px){
.docket-page{padding-top:26px;gap:25px}
.docket-page h1{font-size:clamp(39px,11.8cqw,52px);line-height:1.07;letter-spacing:-1.8px}
.docket-page .eyebrow{font-size:12px;margin-bottom:13px}
.docket-page .intro{font-size:15px;line-height:1.6;margin:18px 0 0}
.docket{padding:20px;border:1px solid #7b876f;border-radius:14px;box-shadow:none}
.docket:focus-within{box-shadow:none}
.docket-title{margin-bottom:20px}
.docket-title h2{font-size:27px}
.docket textarea{min-height:135px}
.docket .primary{border-width:1px;box-shadow:none;min-height:48px}
.docket .secondary{margin-top:12px;font-size:12px}
.docket-page .shelf{display:none}
}

<script>
const sample='lemon chickpea pasta for two. garlic, olive oil, a tin of chickpeas, lemon, spinach. a bit of pasta water to bring it together. parmesan on top.';
let draft='';
const recipe=()=>`<article class="recipe"><div class="recipe-top"><span>Prep Sheet / 001</span><span>Weeknight favourite</span></div><h2>Lemon & chickpea<br>pasta</h2><div class="meta"><span>25 minutes</span><span>Serves 2</span></div><h3>Ingredients</h3><div class="ingredient">Pasta<span>200 g</span></div><div class="ingredient">Chickpeas, drained<span>1 tin</span></div><div class="ingredient">Lemon<span>1</span></div><div class="ingredient">Baby spinach<span>2 handfuls</span></div><h3>Method</h3><p>Soften the garlic in olive oil. Add the chickpeas, then toss with cooked pasta, lemon and a splash of pasta water. Fold in the spinach and finish with parmesan.</p></article>`;
const composer=(label='What would you like to cook?')=>`<form class="composer"><label for="recipe-input">${label}</label><textarea id="recipe-input" placeholder="Paste a recipe, a link, or an idea for dinner…"></textarea><div class="composer-bottom"><small>Ingredients and steps,<br>all in one place.</small><button class="primary" type="submit">Make a recipe <span>↗</span></button></div></form>`;
const views={
A:()=>`<div class="wrap"><section class="notebook"><div><h1>Big ideas.<br><em>Good dinners.</em></h1><p class="intro">The recipe in your notes. The link a friend sent. Give them a place in your kitchen.</p>${composer()}<button class="secondary" data-action="sample">Try it with a lemon pasta recipe</button></div><div class="notebook-scene">${recipe()}<p class="under-note">A clear ingredients list. A method you can follow.<br>Room for your own changes.</p></div></section><div class="bottom-caption"><span>Keep the recipes worth making again.</span><span>Your own little collection, built one dinner at a time.</span></div></div>`,
B:()=>`<section class="bold-page"><div class="wrap bold-grid"><div><h1>Something<br><em>good's<br>cooking.</em></h1><p class="intro">Turn a recipe, a link or a half-formed dinner idea into ingredients and steps.</p></div><div>${composer('Start with whatever you have.')}<div class="suggestions"><button data-action="sample">Try lemon chickpea pasta ↗</button><button data-action="manual">Write my own</button></div><div class="bold-preview"><div><h2>Lemon & chickpea pasta</h2><p>25 minutes · Serves 2<br>The kind of dinner you'll make on repeat.</p><button class="secondary" data-action="preview">Open example recipe ↗</button></div><span class="mini-index">01</span></div></div></div></section><div class="wrap wide-note"><h2>Keep a good dinner<br>in your back pocket.</h2><p>Save your favourites, adjust them to your taste, and pull them up when it's time to cook.</p></div>`,
C:()=>`<div class="wrap"><section class="docket-page"><div><h1>A little prep.<br><em>A good dinner.</em></h1><p class="intro">Recipes collected from all over, written up the way you like to cook.</p><div class="shelf"><p>Keep the recipes you come back to, and make a few changes along the way.</p></div></div><div class="docket"><div class="docket-title"><h2>What's cooking?</h2></div>${composer('Recipe, link or dinner idea')}<button class="secondary" data-action="sample">Try an example: lemon chickpea pasta ↗</button></div></section></div>`,
D:()=>`<div class="wrap"><section class="compare-intro"><h1>A scribble.<br><em>A proper recipe.</em></h1><p class="intro">Turn your kitchen notes into something you can cook from. Here's what that looks like.</p></section><section class="comparison" aria-label="Example recipe transformation"><div class="compare-tabs"><button aria-pressed="false" data-compare="original">The scribble</button><button aria-pressed="true" data-compare="recipe">The recipe</button></div><div class="compare-body"><div class="raw"><blockquote>“${sample}”</blockquote><p class="under-note">Same dinner. A little more organised.</p></div>${recipe()}</div></section><div class="compare-cta"><button class="primary" data-action="start">Try your own recipe <span>↗</span></button><button class="secondary" data-action="sample-dialog">Use these example notes</button><p class="experiment-note">Example recipe shown. You can edit the ingredients and method.</p></div></div>`};
const select=document.querySelector('#variant'),page=document.querySelector('#page'),canvas=document.querySelector('#canvas');
function render(key){select.value=views[key]?key:'A';canvas.dataset.variant=select.value;page.innerHTML=views[select.value]();const input=document.querySelector('#recipe-input');if(input)input.value=draft;const url=new URL(location.href);url.searchParams.set('variant',select.value);try{history.replaceState(null,'',url)}catch{}window.scrollTo(0,0)}
function cycle(step){const keys=Object.keys(views);render(keys[(keys.indexOf(select.value)+step+keys.length)%keys.length])}
select.onchange=()=>render(select.value);document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
document.querySelector('#size').onclick=e=>{const active=canvas.classList.toggle('phone');e.target.setAttribute('aria-pressed',active);e.target.textContent=active?'Full width':'Mobile preview'};
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
document.addEventListener('input',e=>{if(e.target.id==='recipe-input')draft=e.target.value});
let noticeTimer;function notify(text){const box=document.querySelector('.toast');box.textContent=text;box.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.hidden=true,5000)}
function preview(){document.querySelector('#demo-content').innerHTML=recipe();document.querySelector('#demo').showModal()}
document.addEventListener('submit',e=>{e.preventDefault();preview()});
document.addEventListener('click',e=>{const tab=e.target.closest('[data-compare]');if(tab){document.querySelectorAll('[data-compare]').forEach(b=>b.setAttribute('aria-pressed',b===tab));document.querySelector('.compare-body').classList.toggle('show-original',tab.dataset.compare==='original');return}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case 'sample':draft=sample;document.querySelector('#recipe-input').value=draft;document.querySelector('#recipe-input').focus();break;case 'preview':case 'sample-dialog':preview();break;case 'start':document.querySelector('#demo-content').innerHTML=composer('Your recipe notes');document.querySelector('#demo-content textarea').value=draft;document.querySelector('#demo').showModal();break;case 'manual':notify('Design preview only. In the app, this opens the manual recipe editor.');break;case 'signin':notify('Design preview only. Sign-in is available in the Prep Sheet app.');break;case 'about':notify('Prep Sheet turns recipe links, text and dinner ideas into recipes you can edit and keep.');break}});
render(new URLSearchParams(location.search).get('variant')||'A');
</script></body></html>
